name: "Docs (문서 수정)"
description: "README, API 명세 등 문서를 수정할 때 사용합니다."
title: "[Docs] "
labels: ["Docs"]
type: Task
body:
  - type: textarea
    id: overview
    attributes:
      label: "Overview"
      description: "작업의 목적과 배경을 작성합니다."
      placeholder: "예: API 명세서 최신화가 필요합니다."
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: "Description"
      description: "구체적인 작업 내용이나 상황을 작성합니다."
      placeholder: "예: 회원가입 Response 필드 변경 사항을 반영합니다."
  - type: textarea
    id: todo
    attributes:
      label: "To do"
      placeholder: "예: - [ ] API 문서 업데이트"
