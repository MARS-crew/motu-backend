name: "Perf (성능 개선)"
description: "기능은 그대로 두고 속도나 자원 사용량을 개선할 때 사용합니다."
title: "[Perf] "
labels: ["Perf"]
type: Task
body:
  - type: textarea
    id: overview
    attributes:
      label: "Overview"
      description: "작업의 목적과 배경을 작성합니다."
      placeholder: "예: 게시글 목록 조회 API 응답이 느립니다."
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: "Description"
      description: "구체적인 작업 내용이나 상황을 작성합니다."
      placeholder: "예: N+1 쿼리로 인해 응답 시간이 2초 이상 걸립니다."
  - type: textarea
    id: todo
    attributes:
      label: "To do"
      placeholder: "예: - [ ] 쿼리 개선 및 응답 시간 측정"
