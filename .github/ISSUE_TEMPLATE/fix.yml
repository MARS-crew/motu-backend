name: "Fix (버그 수정)"
description: "버그를 수정할 때 사용합니다. 긴급 수정도 포함합니다."
title: "[Fix] "
labels: ["Fix"]
type: Bug
body:
  - type: textarea
    id: overview
    attributes:
      label: "Overview"
      description: "작업의 목적과 배경을 작성합니다."
      placeholder: "예: 회원가입 시 이메일 중복 검사가 동작하지 않습니다."
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: "Description"
      description: "구체적인 작업 내용이나 상황을 작성합니다."
      placeholder: "예: 중복 이메일로 가입 요청 시 500 에러가 발생합니다."
  - type: textarea
    id: todo
    attributes:
      label: "To do"
      placeholder: "예: - [ ] 중복 검사 로직 수정"
