name: "Chore (기타 작업)"
description: "의존성, 설정 변경, 초기 세팅 등 기타 작업에 사용합니다."
title: "[Chore] "
labels: ["Chore"]
type: Task
body:
  - type: textarea
    id: overview
    attributes:
      label: "Overview"
      description: "작업의 목적과 배경을 작성합니다."
      placeholder: "예: 패키지 의존성 버전 업데이트"
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: "Description"
      description: "구체적인 작업 내용이나 상황을 작성합니다."
      placeholder: "예: 보안 취약점이 있는 패키지 버전을 올립니다."
  - type: textarea
    id: todo
    attributes:
      label: "To do"
      placeholder: "예: - [ ] 버전 변경 및 빌드 확인"
