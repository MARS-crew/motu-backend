name: "Test (테스트 코드)"
description: "테스트 코드를 추가하거나 수정할 때 사용합니다."
title: "[Test] "
labels: ["Test"]
type: Task
body:
  - type: textarea
    id: overview
    attributes:
      label: "Overview"
      description: "작업의 목적과 배경을 작성합니다."
      placeholder: "예: 로그인 서비스 단위 테스트 작성"
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: "Description"
      description: "구체적인 작업 내용이나 상황을 작성합니다."
      placeholder: "예: 성공/실패 케이스 테스트 코드가 누락되었습니다."
  - type: textarea
    id: todo
    attributes:
      label: "To do"
      placeholder: "예: - [ ] LoginServiceTest 작성"
