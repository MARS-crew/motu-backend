name: "Refactor (리팩토링)"
description: "기능 변화 없이 코드 구조를 개선하거나 포맷팅, 파일명 변경, 파일 삭제를 할 때 사용합니다."
title: "[Refactor] "
labels: ["Refactor"]
type: Task
body:
  - type: textarea
    id: overview
    attributes:
      label: "Overview"
      description: "작업의 목적과 배경을 작성합니다."
      placeholder: "예: UserService 클래스 분리가 필요합니다."
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: "Description"
      description: "구체적인 작업 내용이나 상황을 작성합니다."
      placeholder: "예: AS-IS: 단일 서비스 / TO-BE: 도메인별 분리"
  - type: textarea
    id: todo
    attributes:
      label: "To do"
      placeholder: "예: - [ ] Auth 관련 로직 분리"
